name: Test and Check
env:
  TEST_FILES_DST_DIR: crates/uroborosql-fmt/testfiles/dst
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check error and warning
        run: |
          result=$(cargo check --quiet 2>&1)
          echo "${result}"
          test -z "${result}"

      - name: Fmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- --deny warnings

      - name: Execute test
        run: cargo test --workspace

      - name: Check test files diff
        run: git diff --exit-code

      - name: Notify Slack on Failure
        if: failure()
        uses: ./.github/actions/slack-failure-notify
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  catalog-native:
    name: Catalog native - ${{ matrix.host }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Enable long paths for parser dependency
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: catalog-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Clippy with PostgreSQL provider
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p uroborosql-lint --all-targets --features postgres-catalog -- --deny warnings
      - name: Run native unit and contract tests with PostgreSQL provider
        run: cargo test --locked -p uroborosql-lint --features postgres-catalog
      - name: TLS handshake and certificate verification
        if: runner.os != 'Windows'
        run: python3 crates/uroborosql-lint/tests/postgres/tls_smoke.py
      - name: TLS handshake with Windows native certificate store
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./crates/uroborosql-lint/tests/postgres/tls_windows.ps1

  catalog-postgres:
    name: Catalog PostgreSQL 14-18
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: catalog-postgres-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      # run.py explicitly runs the ignored integration cases; PG18 adds TLS/faults.
      - name: Run disposable PostgreSQL integration fixture
        run: python3 crates/uroborosql-lint/tests/postgres/run.py
