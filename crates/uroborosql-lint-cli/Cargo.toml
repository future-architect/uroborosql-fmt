[package]
name = "uroborosql-lint-cli"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "uroborosql-lint"
path = "src/main.rs"

[features]
default = ["postgres-catalog", "sqlite-catalog"]
postgres-catalog = ["uroborosql-lint/postgres-catalog"]
sqlite-catalog = ["uroborosql-lint/sqlite-catalog"]

[dependencies]
clap = { workspace = true }
uroborosql-lint = { path = "../uroborosql-lint", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
