[package]
name = "uroborosql-language-server"
version = "1.0.1"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "uroborosql-language-server"
path = "src/main.rs"

[features]
default = ["runtime-tokio", "postgres-catalog"]
postgres-catalog = ["uroborosql-lint/postgres-catalog"]
runtime-tokio = [ "tower-lsp-server/runtime-tokio"]

[dependencies]
clap = { workspace = true }
ropey = "1.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync"] }
tower-lsp-server = { version = "0.22.1", default-features = false }
uroborosql-fmt = { workspace = true }
uroborosql-lint = { workspace = true }

[dev-dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
