[package]
name = "uroborosql-lint"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.94"

[features]
default = []
postgres-catalog = ["dep:sqlx", "dep:tokio", "sqlx/postgres", "sqlx/tls-rustls-ring-native-roots"]
sqlite-catalog = ["dep:sqlx", "dep:tokio", "sqlx/sqlite-bundled"]

[dependencies]
postgresql-cst-parser = { workspace = true }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio"], optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }
tempfile = "3"
